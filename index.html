<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UniKai, satu verse untuk semua komunitas. Gabung, diskusi, dan berkembang bersama."
    />
    <link
      rel="icon"
      href="/favicon/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="theme-color" content="#090718" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>UniKai | Satu Verse. Semua Komunitas.</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("unikai-theme");
        } catch (e) {}
        var dark = stored ? stored === "dark" : true;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Entry point Vite: src/main.ts -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
